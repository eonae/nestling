schema: spec-driven

context: |
  Nestling — лёгкая, современная альтернатива NestJS. Монорепо: yarn workspaces (+lerna/nx).
  Tech stack: TypeScript 5.9 strict, ESM, стандартные ES-декораторы (НЕ experimentalDecorators,
  без reflect-metadata), zod v4 (peer dependency), Node.js 24, vitest на swc
  (тесты запускаются per-package: `yarn test`).
  Пакеты: @nestlingjs/container (DI), @nestlingjs/operations (операции, пайплайн, Ok/Fail),
  @nestlingjs/app (сборка приложения), @nestlingjs/transport.http (node:http +
  find-my-way + busboy), @nestlingjs/transport.cli, @nestlingjs/schema.zod, @nestlingjs/viz.

  Принципы: explicit over implicit; zero magic; минимум зависимостей; schema-first
  (схемы описывают провод); стриминговые границы — стандартный AsyncIterable, не RxJS.

  ВАЖНО: целевой дизайн и логика архитектурных решений — docs/decisions/ideas.md
  (источник истины при расхождениях). Структура документации — docs/README.md.
  Главы гайда по текущему API — docs/guide/. Обзор транспортной архитектуры —
  docs/design/transports.md.

rules:
  proposal:
    - В разделе Why ссылаться на секцию docs/decisions/ideas.md, если решение зафиксировано там
    - Всегда включать раздел Non-goals
  tasks:
    - Для изменений в ядре операций обязательны рантайм-тесты (не только type-тесты)
    - >-
      Последним разделом tasks.md всегда идёт «Definition of Done» с чекбоксами:
      `yarn verify` зелёный; README затронутых пакетов обновлены (включая плашки
      статуса); design/ и decisions/ синхронизированы по правилам CLAUDE.md;
      запись ideas.md, по которой шёл change, несёт пометку «РЕАЛИЗОВАНО»;
      `yarn docs:audit` — 0 ERROR; затронутые examples/* мигрированы,
      главы гайда пересверены с обновлённой датой в плашке «сверено с кодом»;
      скилл для агента (packages/nestling.agent-skill/skill/) обновлён, если
      change изменил публичные имена, формы вызова или состав пакетов;
      `main` не тронут — слияние делает Merger после `/opsx:archive`

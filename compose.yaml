# Службы для прогонов против настоящих зависимостей.
#
# Поднимает их `yarn test:live`; вручную — `docker compose up -d nats`.
# В `yarn verify` они не входят: тесты пакетов идут на двойниках и без
# сети.
name: nestling

services:
  # Брокер живого прогона `@nestlingjs/transport.nats`. `-js` включает
  # JetStream: без него нет ни потоков, ни durable-потребителей, а
  # долговечная доставка транспорта стоит именно на них
  nats:
    image: nats:2
    command: ['-js']
    ports:
      # Порт хоста переопределяется `NATS_LIVE_PORT`: 4222 занят у всякого,
      # кто держит свой брокер, и тогда прогон не запустился бы вовсе
      - '${NATS_LIVE_PORT:-4222}:4222'

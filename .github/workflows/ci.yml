# Проверка изменений. Тег публикуется из состояния, которое прошло эти шаги
name: CI

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  # Коммит подъёма версии уходит в ветку и тегом одной командой, и каждый
  # ref запускает свой workflow. Проверять такой коммит дважды незачем:
  # verify по нему прогоняет релиз, и его результат решает, публиковать ли
  tagged:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.check.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-tags: true

      - id: check
        run: |
          if git tag --points-at HEAD | grep -q '^v'; then
            echo 'version=yes' >> "$GITHUB_OUTPUT"
          else
            echo 'version=no' >> "$GITHUB_OUTPUT"
          fi

  verify:
    needs: tagged
    if: needs.tagged.outputs.version == 'no'
    runs-on: ubuntu-latest

    # PostgreSQL для тестов, которым нужна настоящая база: адаптер
    # хранилища outbox'а, транзакция запроса и спеки примера. Без адреса
    # базы они пропускаются, поэтому здесь он задан — CI проверяет и SQL
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: nestling
          POSTGRES_PASSWORD: nestling
          POSTGRES_DB: nestling
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U nestling -d nestling"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      # Тесты гейтятся своей переменной: боевой ключ `DATABASE_URL` в
      # окружении прогона ломал бы спеки, которые проверяют поведение
      # конфига при отсутствующем ключе. Баз две: таблица пользователей
      # есть у обоих примеров, а миграции у них разные
      TEST_DATABASE_URL: postgresql://nestling:nestling@localhost:5432/nestling
      MODULAR_TEST_DATABASE_URL: postgresql://nestling:nestling@localhost:5432/modular

    steps:
      # Полная история: плашка главы называет коммит, с которым текст
      # сверяли, и `docs:audit` разрешает этот хэш в репозитории. В клоне
      # глубиной один коммит разрешать нечего
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Yarn берётся из репозитория (`yarnPath` в `.yarnrc.yml`), запустить
      # его умеет corepack — на runner'е предустановлен yarn другой версии
      - run: corepack enable

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: yarn

      - run: yarn install --immutable

      # Схемы примеров накатываются до тестов: спеки читают те же базы
      - run: yarn workspace @examples/microservice run db:migrate
        env:
          DATABASE_URL: postgresql://nestling:nestling@localhost:5432/nestling

      - run: psql "$TEST_DATABASE_URL" -c 'create database modular'

      - run: yarn workspace @examples/modular-app run db:migrate
        env:
          DATABASE_URL: ${{ env.MODULAR_TEST_DATABASE_URL }}

      # build, typecheck, lint, test, type-budget и smoke — по всем пакетам
      - run: yarn verify

      # Документация проверяется в ветке, а не на теге, когда публикация
      # уже идёт: расхождение оглавления, битая ссылка и нарушенный
      # паритет языков становятся известными здесь
      - run: yarn docs:audit

      - run: yarn docs:build

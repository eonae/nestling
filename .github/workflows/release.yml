# Публикация в реестр. Версию поднимает человек (`yarn lerna version`),
# тег ставит человек — workflow только публикует то, что уже в манифестах.
# Ключа доступа к реестру здесь нет: и право публиковать, и подпись
# provenance даёт OIDC-обмен с доверенным издателем, который заведён на
# странице каждого пакета
name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read
  # Без этого права OIDC-обмен не состоится
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - run: corepack enable

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: yarn
          # Пишет .npmrc с адресом реестра
          registry-url: https://registry.npmjs.org

      # Доверенного издателя npm понимает с версии 11.5.1, а с Node 24
      # на runner'е приезжает та, что попала в образ
      - run: npm install -g npm@latest

      - run: yarn install --immutable

      - run: yarn verify

      # Установка тарболов в проект вне репозитория: последняя проверка
      # перед публикацией, которую отменить уже нельзя
      - run: yarn pack:check

      - run: node scripts/publish.mjs
        env:
          NPM_CONFIG_PROVENANCE: true

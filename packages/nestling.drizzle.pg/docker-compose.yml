# PostgreSQL для тестов пакета, которым нужна настоящая база.
#
# `yarn db:up` поднимает базу, `yarn db:down` убирает её вместе с томом.
# Порт нестандартный: база примера занимает 5432, и обе должны подниматься
# рядом. Схему накатывать не нужно — тесты создают свои таблицы сами.
#
#   yarn db:up
#   TEST_DATABASE_URL=postgresql://nestling:nestling@localhost:55432/nestling yarn test
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: nestling
      POSTGRES_PASSWORD: nestling
      POSTGRES_DB: nestling
    ports:
      - '55432:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U nestling -d nestling']
      interval: 2s
      timeout: 2s
      retries: 15

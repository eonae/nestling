<!DOCTYPE html>
<!-- СГЕНЕРИРОВАНО scripts/site/build.mjs из источников scripts/site/sections.mjs. Правки вносить в исходные файлы. -->
<html lang="{{lang}}" data-theme="">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
{{head}}
<style>
{{styles}}
</style>
</head>
<body data-root="{{root}}" data-lang-root="{{langroot}}" data-mode="{{mode}}">

<header class="topbar">
  <button class="icon-btn menu-btn" onclick="__toggleMenu()" aria-label="{{menu}}">☰</button>
  <a class="brand" href="{{home}}"><span class="logo">🐣</span> Nestling <span class="tag hide-sm">{{tagline}}</span></a>
  <span class="spacer"></span>
{{toplinks}}
{{search}}
{{langs}}
  <button class="icon-btn" id="theme-btn" onclick="__toggleTheme()" aria-label="{{themelabel}}">☾</button>
</header>

<div class="backdrop" onclick="__closeMenu()"></div>

<div class="layout">
{{sidebar}}

<main class="content">
<article class="article">
{{article}}
</article>
</main>
</div>

<script>
{{script}}
</script>
</body>
</html>
